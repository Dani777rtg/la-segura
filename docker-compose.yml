services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: parcero
      POSTGRES_PASSWORD: parcero_dev_only
      POSTGRES_DB: parcero
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parcero"]
      interval: 3s
      retries: 20
volumes:
  pgdata:
